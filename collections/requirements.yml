---
# Installed automatically by Ansible Automation Platform (AAP) project sync using the organization's Galaxy credentials (in AAP's order).
# Preference order (see CLAUDE.md): Red Hat certified > Red Hat validated > community/Galaxy.
collections:
  # --- Red Hat certified (console.redhat.com "published") ---
  - name: ansible.platform        # AAP 2.5+ gateway: orgs, teams, users, authenticators, tokens
  - name: ansible.controller      # automation controller objects
    version: ">=4.6.0"
  - name: ansible.eda             # Event-Driven Ansible objects
  - name: ansible.hub             # private automation hub objects
  - name: redhat.openshift        # Red Hat's OpenShift collection: k8s apply/patch tasks use redhat.openshift.k8s
  - name: kubernetes.core         # k8s_info / k8s_exec (Red Hat certified; also a dependency of redhat.openshift)
  # --- Red Hat validated (console.redhat.com "validated") ---
  - name: infra.aap_configuration           # configuration as code (CaC) roles + dispatch for AAP 2.5+
  # --- extended CaC roles (filetree export/read, object_diff); validated if available, else Galaxy ---
  - name: infra.aap_configuration_extended
...
