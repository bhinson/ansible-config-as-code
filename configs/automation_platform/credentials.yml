---
# Credentials used by the configuration as code job templates.
# Secret inputs are normally stored once by playbooks/initialize_automation_platform.yml. Later runs (in AAP) leave them
# alone: update_secrets is false, and inputs are omitted unless the {{ vaulted_* }} variables are supplied (from a
# vault-encrypted vars file, never committed in plain text) to set or rotate them.
controller_credentials:
  - name: Configuration as code - OpenShift API
    description: Cluster API access for openshift_* roles (custom type injects K8S_AUTH_* including the certificate authority)
    organization: "{{ site_organization }}"
    credential_type: OpenShift API (configuration as code)
    update_secrets: false
    inputs: >-
      {{ {'host': vaulted_openshift_api_url, 'bearer_token': vaulted_openshift_api_token,
          'ssl_ca_cert': vaulted_openshift_api_ca_cert}
         if vaulted_openshift_api_token is defined else omit }}

  - name: Configuration as code - Ansible Automation Platform
    description: Ansible Automation Platform gateway access for roles that call its API (injects aap_hostname / aap_token)
    organization: "{{ site_organization }}"
    credential_type: Red Hat Ansible Automation Platform
    update_secrets: false
    inputs: >-
      {{ {'host': vaulted_aap_url, 'oauth_token': vaulted_aap_token,
          'verify_ssl': site_automation_platform_validate_certs | bool}
         if vaulted_aap_token is defined else omit }}
...
