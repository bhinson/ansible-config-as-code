---
# Initialize Ansible Automation Platform (AAP) so it can apply this repo's configuration itself. Needs only ansible-core
# (ansible.builtin.uri against the documented AAP REST API); no certified collections on the machine running it.
# Creates, if missing, the objects needed to bootstrap (names and the credential type come from configs/automation_platform/):
#   1. credential type "OpenShift API (configuration as code)"
#   2. credentials "Configuration as code - OpenShift API" and "Configuration as code - Ansible Automation Platform"
#      (secrets set from the inputs below; re-applied on every run unless initialize_automation_platform_update_secrets=false)
#   3. project "Configuration as code - ansible-config-as-code" (site_project_scm_url), waits for its first sync
#   4. inventory "Configuration as code - localhost" with host localhost
#   5. job template "Configuration as code | Apply Ansible Automation Platform configuration"
#      (playbook configure_automation_platform.yml, the AAP credential, the site_* values as extra vars;
#      the extra vars are refreshed on every run)
# then launches that job template and waits (initialize_automation_platform_launch). AAP installs the certified collections
# during project sync with the organization's console.redhat.com credential, and its run creates everything else.
#
# Inputs (environment variables, e.g. from scripts/env.sh, or the matching extra vars):
#   AAP_HOSTNAME (gateway URL), AAP_TOKEN (OAuth2 token of an AAP administrator), AAP_VALIDATE_CERTS (default true),
#   AAP_CA_FILE (optional PEM bundle that signed the gateway certificate; falls back to SSL_CERT_FILE)
#   K8S_AUTH_HOST, K8S_AUTH_API_KEY, K8S_AUTH_SSL_CA_CERT (path to the cluster API CA bundle, PEM)
#   site values: -e @/path/to/site.yml (see configs/automation_platform/README.md, "Site settings")
# Usage:  ansible-playbook playbooks/initialize_automation_platform.yml -e @/path/to/site.yml
- name: Initialize Ansible Automation Platform for configuration as code
  hosts: localhost
  connection: local
  gather_facts: false
  module_defaults:
    ansible.builtin.uri:
      ca_path: "{{ initialize_automation_platform_ca_file | default(omit, true) }}"
  vars:
    initialize_automation_platform_ca_file: >-
      {{ lookup('ansible.builtin.env', 'AAP_CA_FILE') or lookup('ansible.builtin.env', 'SSL_CERT_FILE') }}
    initialize_automation_platform_url: "{{ lookup('ansible.builtin.env', 'AAP_HOSTNAME') | regex_replace('/+$', '') }}"
    initialize_automation_platform_token: "{{ lookup('ansible.builtin.env', 'AAP_TOKEN') }}"
    initialize_automation_platform_validate_certs: "{{ lookup('ansible.builtin.env', 'AAP_VALIDATE_CERTS') | default('true', true) }}"
    initialize_automation_platform_openshift_api_url: "{{ lookup('ansible.builtin.env', 'K8S_AUTH_HOST') }}"
    initialize_automation_platform_openshift_api_token: "{{ lookup('ansible.builtin.env', 'K8S_AUTH_API_KEY') }}"
    initialize_automation_platform_openshift_api_ca_file: "{{ lookup('ansible.builtin.env', 'K8S_AUTH_SSL_CA_CERT') }}"
    initialize_automation_platform_update_secrets: true
    initialize_automation_platform_launch: true
    initialize_automation_platform_job_template: Configuration as code | Apply Ansible Automation Platform configuration
    initialize_automation_platform_wait_retries: 120
    initialize_automation_platform_wait_delay: 10
    __initialize_api: "{{ initialize_automation_platform_url }}/api/controller/v2"
    __initialize_headers:
      Authorization: "Bearer {{ initialize_automation_platform_token }}"
  tasks:
    - name: Initialize | Load the repo's configuration data (site values from -e @site.yml override the examples)
      ansible.builtin.include_vars:
        dir: "{{ playbook_dir }}/../configs/automation_platform"
        extensions: [yml]
        ignore_unknown_extensions: true

    - name: Initialize | Collect the names and site values to use
      ansible.builtin.set_fact:
        __initialize_credential_type: "{{ controller_credential_types | first }}"
        __initialize_openshift_credential: >-
          {{ controller_credentials | selectattr('credential_type', 'equalto', (controller_credential_types | first).name) | first }}
        __initialize_platform_credential: >-
          {{ controller_credentials | selectattr('credential_type', 'equalto', 'Red Hat Ansible Automation Platform') | first }}
        __initialize_project: "{{ controller_projects | first }}"
        __initialize_inventory_name: Configuration as code - localhost
        __initialize_site_values: >-
          {{ dict(query('ansible.builtin.varnames', '^site_') | zip(query('ansible.builtin.vars', *query('ansible.builtin.varnames', '^site_')))) }}

    - name: Initialize | Check inputs
      ansible.builtin.assert:
        that:
          - initialize_automation_platform_url is match('https://.+')
          - initialize_automation_platform_token | length > 0
          - initialize_automation_platform_openshift_api_url is match('https://.+')
          - initialize_automation_platform_openshift_api_token | length > 0
          - initialize_automation_platform_openshift_api_ca_file | length > 0
          - __initialize_site_values.site_project_scm_url is match('https?://.+')
        fail_msg: >-
          Set AAP_HOSTNAME, AAP_TOKEN, K8S_AUTH_HOST, K8S_AUTH_API_KEY and K8S_AUTH_SSL_CA_CERT (or the matching
          initialize_automation_platform_* extra vars) and pass your site values with -e @site.yml.
        quiet: true

    - name: Initialize | Look up the organization, execution environment and AAP credential type
      ansible.builtin.uri:
        url: "{{ __initialize_api }}/{{ item.path }}/?name={{ item.name | urlencode }}"
        headers: "{{ __initialize_headers }}"
        validate_certs: "{{ initialize_automation_platform_validate_certs | bool }}"
      loop:
        - {path: organizations, name: "{{ __initialize_site_values.site_organization }}"}
        - {path: execution_environments, name: "{{ __initialize_site_values.site_execution_environment }}"}
        - {path: credential_types, name: Red Hat Ansible Automation Platform}
        - {path: credential_types, name: "{{ __initialize_credential_type.name }}"}
      loop_control:
        label: "{{ item.path }}: {{ item.name }}"
      register: __initialize_lookups
      check_mode: false
      # every lookup must find exactly one object, except the custom credential type (created below if missing)
      failed_when: >-
        __initialize_lookups.status != 200
        or (item.name != __initialize_credential_type.name and __initialize_lookups.json.count != 1)

    - name: Initialize | Create the credential type
      ansible.builtin.uri:
        url: "{{ __initialize_api }}/credential_types/"
        method: POST
        headers: "{{ __initialize_headers }}"
        body_format: json
        body: "{{ __initialize_credential_type }}"
        validate_certs: "{{ initialize_automation_platform_validate_certs | bool }}"
        status_code: 201
      register: __initialize_credential_type_create
      when: __initialize_lookups.results[3].json.count == 0
      changed_when: true

    - name: Initialize | Remember the IDs
      ansible.builtin.set_fact:
        __initialize_organization_id: "{{ __initialize_lookups.results[0].json.results[0].id }}"
        __initialize_execution_environment_id: "{{ __initialize_lookups.results[1].json.results[0].id }}"
        __initialize_platform_type_id: "{{ __initialize_lookups.results[2].json.results[0].id }}"
        __initialize_openshift_type_id: >-
          {{ __initialize_credential_type_create.json.id if __initialize_credential_type_create is changed
             else __initialize_lookups.results[3].json.results | map(attribute='id') | first | default('') }}

    - name: Initialize | Look up the credentials
      ansible.builtin.uri:
        url: "{{ __initialize_api }}/credentials/?name={{ item | urlencode }}&organization={{ __initialize_organization_id }}"
        headers: "{{ __initialize_headers }}"
        validate_certs: "{{ initialize_automation_platform_validate_certs | bool }}"
      loop:
        - "{{ __initialize_openshift_credential.name }}"
        - "{{ __initialize_platform_credential.name }}"
      register: __initialize_credential_lookups
      check_mode: false

    - name: Initialize | Create or update the credentials
      ansible.builtin.uri:
        url: >-
          {{ __initialize_api }}/credentials/{{ (item.existing.id ~ '/') if item.existing else '' }}
        method: "{{ 'PATCH' if item.existing else 'POST' }}"
        headers: "{{ __initialize_headers }}"
        body_format: json
        body: >-
          {{ {'inputs': item.inputs} if item.existing else
             {'name': item.name, 'description': item.description, 'organization': __initialize_organization_id | int,
              'credential_type': item.type_id | int, 'inputs': item.inputs} }}
        validate_certs: "{{ initialize_automation_platform_validate_certs | bool }}"
        status_code: [200, 201]
      loop:
        - name: "{{ __initialize_openshift_credential.name }}"
          description: "{{ __initialize_openshift_credential.description }}"
          type_id: "{{ __initialize_openshift_type_id }}"
          existing: "{{ __initialize_credential_lookups.results[0].json.results | first | default({}) }}"
          inputs:
            host: "{{ initialize_automation_platform_openshift_api_url }}"
            bearer_token: "{{ initialize_automation_platform_openshift_api_token }}"
            ssl_ca_cert: "{{ lookup('ansible.builtin.file', initialize_automation_platform_openshift_api_ca_file) }}"
        - name: "{{ __initialize_platform_credential.name }}"
          description: "{{ __initialize_platform_credential.description }}"
          type_id: "{{ __initialize_platform_type_id }}"
          existing: "{{ __initialize_credential_lookups.results[1].json.results | first | default({}) }}"
          inputs:
            host: "{{ initialize_automation_platform_url }}"
            oauth_token: "{{ initialize_automation_platform_token }}"
            verify_ssl: "{{ __initialize_site_values.site_automation_platform_validate_certs | bool }}"
      loop_control:
        label: "{{ item.name }}"
      register: __initialize_credentials
      when: not item.existing or initialize_automation_platform_update_secrets | bool
      changed_when: true
      no_log: true

    - name: Initialize | Look up the credential IDs
      ansible.builtin.uri:
        url: "{{ __initialize_api }}/credentials/?name={{ __initialize_platform_credential.name | urlencode }}&organization={{ __initialize_organization_id }}"
        headers: "{{ __initialize_headers }}"
        validate_certs: "{{ initialize_automation_platform_validate_certs | bool }}"
      register: __initialize_platform_credential_lookup
      check_mode: false

    - name: Initialize | Look up the project and inventory
      ansible.builtin.uri:
        url: "{{ __initialize_api }}/{{ item.path }}/?name={{ item.name | urlencode }}&organization={{ __initialize_organization_id }}"
        headers: "{{ __initialize_headers }}"
        validate_certs: "{{ initialize_automation_platform_validate_certs | bool }}"
      loop:
        - {path: projects, name: "{{ __initialize_project.name }}"}
        - {path: inventories, name: "{{ __initialize_inventory_name }}"}
      loop_control:
        label: "{{ item.path }}: {{ item.name }}"
      register: __initialize_object_lookups
      check_mode: false

    - name: Initialize | Dry run - look up the configure job template
      ansible.builtin.uri:
        url: >-
          {{ __initialize_api }}/job_templates/?name={{ initialize_automation_platform_job_template | urlencode
          }}&organization={{ __initialize_organization_id }}
        headers: "{{ __initialize_headers }}"
        validate_certs: "{{ initialize_automation_platform_validate_certs | bool }}"
      register: __initialize_dry_run_job_template
      check_mode: false
      when: ansible_check_mode

    - name: Initialize | Dry run - report the plan
      ansible.builtin.debug:
        msg:
          - "credential type '{{ __initialize_credential_type.name }}': {{ 'exists' if __initialize_lookups.results[3].json.count else 'CREATE' }}"
          - >-
            credential '{{ __initialize_openshift_credential.name }}':
            {{ 'exists, update secrets' if __initialize_credential_lookups.results[0].json.count else 'CREATE' }}
          - >-
            credential '{{ __initialize_platform_credential.name }}':
            {{ 'exists, update secrets' if __initialize_credential_lookups.results[1].json.count else 'CREATE' }}
          - >-
            project '{{ __initialize_project.name }}' ({{ __initialize_site_values.site_project_scm_url }}):
            {{ 'exists' if __initialize_object_lookups.results[0].json.count else 'CREATE and sync' }}
          - >-
            inventory '{{ __initialize_inventory_name }}':
            {{ 'exists' if __initialize_object_lookups.results[1].json.count else 'CREATE with host localhost' }}
          - "job template '{{ initialize_automation_platform_job_template }}': {{ 'exists' if __initialize_dry_run_job_template.json.count else 'CREATE' }}"
          - "then: {{ 'LAUNCH it and wait' if initialize_automation_platform_launch | bool else 'do not launch' }}"
          - "job template extra vars (site values): {{ __initialize_site_values }}"
      when: ansible_check_mode

    - name: Initialize | Dry run - stop here
      ansible.builtin.meta: end_play
      when: ansible_check_mode

    - name: Initialize | Create the project
      ansible.builtin.uri:
        url: "{{ __initialize_api }}/projects/"
        method: POST
        headers: "{{ __initialize_headers }}"
        body_format: json
        # bodies with IDs are single dict expressions so the IDs stay integers on ansible-core < 2.19
        body: >-
          {{ {'name': __initialize_project.name, 'description': __initialize_project.description,
              'organization': __initialize_organization_id | int, 'scm_type': 'git',
              'scm_url': __initialize_site_values.site_project_scm_url,
              'scm_branch': __initialize_site_values.site_project_scm_branch, 'scm_update_on_launch': true,
              'default_environment': __initialize_execution_environment_id | int} }}
        validate_certs: "{{ initialize_automation_platform_validate_certs | bool }}"
        status_code: 201
      register: __initialize_project_create
      when: __initialize_object_lookups.results[0].json.count == 0
      changed_when: true

    - name: Initialize | Remember the project ID
      ansible.builtin.set_fact:
        __initialize_project_id: >-
          {{ __initialize_project_create.json.id if __initialize_project_create is changed
             else __initialize_object_lookups.results[0].json.results[0].id }}

    - name: Initialize | Wait for the project to sync
      ansible.builtin.uri:
        url: "{{ __initialize_api }}/projects/{{ __initialize_project_id }}/"
        headers: "{{ __initialize_headers }}"
        validate_certs: "{{ initialize_automation_platform_validate_certs | bool }}"
      register: __initialize_project_status
      check_mode: false
      until: __initialize_project_status.json.status in ['successful', 'failed', 'error', 'canceled']
      retries: "{{ initialize_automation_platform_wait_retries }}"
      delay: "{{ initialize_automation_platform_wait_delay }}"
      failed_when: __initialize_project_status.json.status != 'successful'

    - name: Initialize | Create the localhost inventory
      ansible.builtin.uri:
        url: "{{ __initialize_api }}/inventories/"
        method: POST
        headers: "{{ __initialize_headers }}"
        body_format: json
        body: >-
          {{ {'name': __initialize_inventory_name, 'description': 'Control-node-only inventory for configuration-as-code jobs',
              'organization': __initialize_organization_id | int} }}
        validate_certs: "{{ initialize_automation_platform_validate_certs | bool }}"
        status_code: 201
      register: __initialize_inventory_create
      when: __initialize_object_lookups.results[1].json.count == 0
      changed_when: true

    - name: Initialize | Add localhost to the new inventory
      ansible.builtin.uri:
        url: "{{ __initialize_api }}/inventories/{{ __initialize_inventory_create.json.id }}/hosts/"
        method: POST
        headers: "{{ __initialize_headers }}"
        body_format: json
        body:
          name: localhost
          variables: "{{ {'ansible_connection': 'local'} | to_json }}"
        validate_certs: "{{ initialize_automation_platform_validate_certs | bool }}"
        status_code: 201
      when: __initialize_inventory_create.json.id is defined
      changed_when: true

    - name: Initialize | Look up the configure job template
      ansible.builtin.uri:
        url: >-
          {{ __initialize_api }}/job_templates/?name={{ initialize_automation_platform_job_template | urlencode
          }}&organization={{ __initialize_organization_id }}
        headers: "{{ __initialize_headers }}"
        validate_certs: "{{ initialize_automation_platform_validate_certs | bool }}"
      register: __initialize_job_template_lookup
      check_mode: false

    - name: Initialize | Create the configure job template
      ansible.builtin.uri:
        url: "{{ __initialize_api }}/job_templates/"
        method: POST
        headers: "{{ __initialize_headers }}"
        body_format: json
        body: >-
          {{ {'name': initialize_automation_platform_job_template,
              'description': 'Apply configs/automation_platform from this repo with infra.aap_configuration.dispatch',
              'project': __initialize_project_id | int, 'playbook': 'playbooks/configure_automation_platform.yml',
              'inventory': (__initialize_inventory_create.json.id if __initialize_inventory_create is changed
                            else __initialize_object_lookups.results[1].json.results[0].id) | int,
              'execution_environment': __initialize_execution_environment_id | int,
              'extra_vars': __initialize_site_values | to_nice_yaml} }}
        validate_certs: "{{ initialize_automation_platform_validate_certs | bool }}"
        status_code: 201
      register: __initialize_job_template_create
      when: __initialize_job_template_lookup.json.count == 0
      changed_when: true

    - name: Initialize | Update the configure job template's site values
      ansible.builtin.uri:
        url: "{{ __initialize_api }}/job_templates/{{ __initialize_job_template_lookup.json.results[0].id }}/"
        method: PATCH
        headers: "{{ __initialize_headers }}"
        body_format: json
        body:
          extra_vars: "{{ __initialize_site_values | to_nice_yaml }}"
        validate_certs: "{{ initialize_automation_platform_validate_certs | bool }}"
      when:
        - __initialize_job_template_lookup.json.count == 1
        - (__initialize_job_template_lookup.json.results[0].extra_vars | default('', true) | from_yaml | default({}, true))
          != __initialize_site_values
      changed_when: true

    - name: Initialize | Remember the job template ID
      ansible.builtin.set_fact:
        __initialize_job_template_id: >-
          {{ __initialize_job_template_create.json.id if __initialize_job_template_create is changed
             else __initialize_job_template_lookup.json.results[0].id }}

    - name: Initialize | List the job template's credentials
      ansible.builtin.uri:
        url: "{{ __initialize_api }}/job_templates/{{ __initialize_job_template_id }}/credentials/"
        headers: "{{ __initialize_headers }}"
        validate_certs: "{{ initialize_automation_platform_validate_certs | bool }}"
      register: __initialize_job_template_credentials
      check_mode: false

    - name: Initialize | Attach the AAP credential to the job template
      ansible.builtin.uri:
        url: "{{ __initialize_api }}/job_templates/{{ __initialize_job_template_id }}/credentials/"
        method: POST
        headers: "{{ __initialize_headers }}"
        body_format: json
        body: "{{ {'id': __initialize_platform_credential_lookup.json.results[0].id | int} }}"
        validate_certs: "{{ initialize_automation_platform_validate_certs | bool }}"
        status_code: 204
      when: >-
        __initialize_platform_credential_lookup.json.results[0].id
        not in (__initialize_job_template_credentials.json.results | map(attribute='id') | list)
      changed_when: true

    - name: Initialize | Launch the configure job template
      ansible.builtin.uri:
        url: "{{ __initialize_api }}/job_templates/{{ __initialize_job_template_id }}/launch/"
        method: POST
        headers: "{{ __initialize_headers }}"
        body_format: json
        body: {}
        validate_certs: "{{ initialize_automation_platform_validate_certs | bool }}"
        status_code: 201
      register: __initialize_launch
      when: initialize_automation_platform_launch | bool
      changed_when: true

    - name: Initialize | Wait for the configure job
      ansible.builtin.uri:
        url: "{{ __initialize_api }}/jobs/{{ __initialize_launch.json.job }}/"
        headers: "{{ __initialize_headers }}"
        validate_certs: "{{ initialize_automation_platform_validate_certs | bool }}"
      register: __initialize_job
      check_mode: false
      until: __initialize_job.json.finished is not none and __initialize_job.json.finished | length > 0
      retries: "{{ initialize_automation_platform_wait_retries }}"
      delay: "{{ initialize_automation_platform_wait_delay }}"
      failed_when: __initialize_job.json.status != 'successful'
      when: initialize_automation_platform_launch | bool

    - name: Initialize | Report
      ansible.builtin.debug:
        msg:
          - "Job template '{{ initialize_automation_platform_job_template }}' (id {{ __initialize_job_template_id }})"
          - >-
            {{ ('Configure job ' ~ __initialize_launch.json.job ~ ': ' ~ __initialize_job.json.status ~ ' - '
                ~ initialize_automation_platform_url ~ '/execution/jobs/playbook/' ~ __initialize_launch.json.job ~ '/output')
               if initialize_automation_platform_launch | bool else 'Not launched (initialize_automation_platform_launch=false)' }}
...
