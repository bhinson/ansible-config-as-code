---
# The operator supports OwnNamespace, SingleNamespace and AllNamespaces. The install guide installs it into the portal
# namespace, so the OperatorGroup targets that namespace. When an AutomationPortal is created, the operator installs the
# Red Hat Developer Hub (RHDH) operator itself if it is missing.
- name: Operator | Create namespaces, OperatorGroup and Subscription
  redhat.openshift.k8s:  # noqa: fqcn[canonical]
    state: present
    apply: true
    template: operator.yml.j2

- name: Operator | Wait for the Subscription to report an installed ClusterServiceVersion
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: Subscription
    name: automation-portal-operator
    namespace: "{{ __portal_operator_namespace }}"
  register: __portal_subscription
  until: (__portal_subscription.resources[0].status.installedCSV | default('')) | length > 0
  retries: "{{ openshift_automation_portal_wait_retries }}"
  delay: "{{ openshift_automation_portal_wait_delay }}"

- name: Operator | Wait for the ClusterServiceVersion to succeed
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    name: "{{ __portal_subscription.resources[0].status.installedCSV }}"
    namespace: "{{ __portal_operator_namespace }}"
  register: __portal_cluster_service_version
  until: (__portal_cluster_service_version.resources[0].status.phase | default('')) == 'Succeeded'
  retries: "{{ openshift_automation_portal_wait_retries }}"
  delay: "{{ openshift_automation_portal_wait_delay }}"
...
