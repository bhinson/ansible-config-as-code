---
# Job templates for the Automation Orchestrator roles. All user inputs come from the surveys; survey defaults use
# the site settings in 00_settings.yml, and the roles themselves stay generic.
controller_templates:
  - name: Automation Orchestrator | Install on OpenShift
    description: >-
      Install the Automation Orchestrator operator, a PostgreSQL 15 database and an AutomationOrchestrator instance
      (role openshift_automation_orchestrator)
    organization: "{{ site_organization }}"
    project: Configuration as code - ansible-config-as-code
    playbook: playbooks/openshift_automation_orchestrator.yml
    inventory: Configuration as code - localhost
    execution_environment: "{{ site_execution_environment }}"
    credentials:
      - Configuration as code - OpenShift API
    survey_enabled: true
    survey_spec:
      name: Automation Orchestrator install
      description: Inputs for openshift_automation_orchestrator
      spec:
        - question_name: Namespace
          question_description: Namespace for the Automation Orchestrator instance and its database
          variable: openshift_automation_orchestrator_namespace
          type: text
          required: true
          default: automation-orchestrator
        - question_name: Operator channel
          variable: openshift_automation_orchestrator_operator_channel
          type: multiplechoice
          choices: [stable, early-access]
          required: true
          default: stable
        - question_name: Operator install plan approval
          variable: openshift_automation_orchestrator_operator_approval
          type: multiplechoice
          choices: [Automatic, Manual]
          required: true
          default: Automatic
        - question_name: Route hostname
          question_description: Leave empty for the OpenShift-generated hostname
          variable: openshift_automation_orchestrator_ingress_host
          type: text
          required: false
          default: ""
        - question_name: Hosts workflow HTTP nodes may call
          question_description: Comma-separated internal hostnames (for example the Ansible Automation Platform gateway host)
          variable: openshift_automation_orchestrator_allowed_hosts
          type: text
          required: false
          default: "{{ site_automation_platform_gateway_host }}"
        - question_name: PostgreSQL storage class
          question_description: Empty = cluster default. Can't be changed after the database is created.
          variable: openshift_automation_orchestrator_postgres_storage_class
          type: text
          required: false
          default: "{{ site_automation_orchestrator_storage_class }}"
        - question_name: PostgreSQL volume size
          variable: openshift_automation_orchestrator_postgres_size
          type: text
          required: true
          default: 10Gi
        - question_name: PostgreSQL max_connections
          question_description: (2 backend + 2 worker + background workers) x 30 + 20 must fit
          variable: openshift_automation_orchestrator_postgres_max_connections
          type: integer
          min: 100
          max: 1000
          required: true
          default: 300
        - question_name: Max background workers
          variable: openshift_automation_orchestrator_background_worker_max
          type: integer
          min: 1
          max: 5
          required: true
          default: 2
        - question_name: Verify the cluster API TLS certificate
          question_description: Set to false only for testing against a cluster API with an untrusted certificate
          variable: openshift_automation_orchestrator_validate_certs
          type: multiplechoice
          choices: ["true", "false"]
          required: true
          default: "true"
        - question_name: Initial Automation Orchestrator admin password
          question_description: Used only on first install; empty = generated and stored in Secret ao-admin-password
          variable: openshift_automation_orchestrator_admin_password
          type: password
          required: false

  - name: Automation Orchestrator | Configure Ansible Automation Platform integration
    description: >-
      Allowlists, Ansible Automation Platform integration (job dispatch) and Ansible Automation Platform single sign-on
      for Automation Orchestrator (role automation_orchestrator_configuration)
    organization: "{{ site_organization }}"
    project: Configuration as code - ansible-config-as-code
    playbook: playbooks/automation_orchestrator_configuration.yml
    inventory: Configuration as code - localhost
    execution_environment: "{{ site_execution_environment }}"
    credentials:
      - Configuration as code - OpenShift API
      - Configuration as code - Ansible Automation Platform
    survey_enabled: true
    survey_spec:
      name: Automation Orchestrator Ansible Automation Platform integration
      description: >-
        Inputs for automation_orchestrator_configuration (the Automation Orchestrator URL, admin password, Ansible
        Automation Platform URL and certificate authority are discovered when empty)
      spec:
        - question_name: Automation Orchestrator namespace
          variable: automation_orchestrator_configuration_namespace
          type: text
          required: true
          default: automation-orchestrator
        - question_name: Integration name
          variable: automation_orchestrator_configuration_integration_name
          type: text
          required: true
          default: Ansible Automation Platform
        - question_name: Integration Ansible Automation Platform token
          question_description: >-
            Ansible Automation Platform OAuth token that Automation Orchestrator stores for health checks and discovery
            (or give a username and password below)
          variable: automation_orchestrator_configuration_integration_token
          type: password
          required: false
        - question_name: Integration Ansible Automation Platform username
          variable: automation_orchestrator_configuration_integration_username
          type: text
          required: false
          default: ""
        - question_name: Integration Ansible Automation Platform password
          variable: automation_orchestrator_configuration_integration_password
          type: password
          required: false
        - question_name: Set up Ansible Automation Platform single sign-on
          variable: automation_orchestrator_configuration_configure_single_sign_on
          type: multiplechoice
          choices: ["true", "false"]
          required: true
          default: "true"
        - question_name: OAuth application organization
          variable: automation_orchestrator_configuration_oauth_app_organization
          type: text
          required: true
          default: "{{ site_organization }}"
        - question_name: Skip TLS verification for the identity provider
          question_description: >-
            Automation Orchestrator identity providers have no certificate authority field; the docs say to enable this
            for internally signed certificates
          variable: automation_orchestrator_configuration_identity_provider_disable_tls_verify
          type: multiplechoice
          choices: ["true", "false"]
          required: true
          default: "true"
        - question_name: Recreate the OAuth application
          question_description: Only if the application exists but Automation Orchestrator doesn't use it (invalidates the old client secret)
          variable: automation_orchestrator_configuration_recreate_oauth_app
          type: multiplechoice
          choices: ["false", "true"]
          required: true
          default: "false"
        - question_name: Verify TLS certificates from this job
          question_description: The job's calls to the cluster API, Automation Orchestrator and Ansible Automation Platform
          variable: automation_orchestrator_configuration_validate_certs
          type: multiplechoice
          choices: ["true", "false"]
          required: true
          default: "true"
        - question_name: Automation Orchestrator verifies the Ansible Automation Platform certificate
          question_description: >-
            false sets insecure_skip_tls_verify on the integration; prefer supplying the certificate authority bundle below
          variable: automation_orchestrator_configuration_integration_validate_certs
          type: multiplechoice
          choices: ["true", "false"]
          required: true
          default: "true"
        - question_name: Certificate authority bundle (PEM)
          question_description: Empty = OpenShift ingress certificate authority
          variable: automation_orchestrator_configuration_ca_certificate
          type: textarea
          required: false
          default: ""
        - question_name: Extra integration hosts
          question_description: Comma-separated extra hostnames to allow for integrations (the Ansible Automation Platform host is always added)
          variable: automation_orchestrator_configuration_integration_extra_allowed_hosts
          type: text
          required: false
          default: ""

  - name: Automation Orchestrator | Configure LLM provider integration
    description: >-
      Connect Automation Orchestrator to an OpenAI API-compatible large language model provider for workflow agent
      nodes (role automation_orchestrator_llm_integration)
    organization: "{{ site_organization }}"
    project: Configuration as code - ansible-config-as-code
    playbook: playbooks/automation_orchestrator_llm_integration.yml
    inventory: Configuration as code - localhost
    execution_environment: "{{ site_execution_environment }}"
    credentials:
      - Configuration as code - OpenShift API
    survey_enabled: true
    survey_spec:
      name: Automation Orchestrator LLM provider integration
      description: >-
        Inputs for automation_orchestrator_llm_integration (the Automation Orchestrator URL, admin password and
        certificate authority are discovered from the cluster)
      spec:
        - question_name: Automation Orchestrator namespace
          variable: automation_orchestrator_llm_integration_namespace
          type: text
          required: true
          default: automation-orchestrator
        - question_name: Integration name
          variable: automation_orchestrator_llm_integration_name
          type: text
          required: true
          default: LLM provider
        - question_name: Provider
          question_description: Provider backend type; red_hat_ai and custom need a base URL
          variable: automation_orchestrator_llm_integration_provider
          type: multiplechoice
          choices: [custom, red_hat_ai, openai, anthropic, gemini]
          required: true
          default: custom
        - question_name: Base URL
          question_description: OpenAI v1 API-compatible endpoint, for example https://llm.example.com/v1
          variable: automation_orchestrator_llm_integration_base_url
          type: text
          required: false
          default: ""
        - question_name: API key
          question_description: Stored in Automation Orchestrator as an LLM Provider credential (health checks and model discovery)
          variable: automation_orchestrator_llm_integration_api_key
          type: password
          required: true
        - question_name: Enabled models
          question_description: Comma-separated provider model IDs to enable; empty = every discovered model
          variable: automation_orchestrator_llm_integration_enabled_models
          type: text
          required: false
          default: ""
        - question_name: Default model
          question_description: Provider model ID to make the default; empty = leave as is
          variable: automation_orchestrator_llm_integration_default_model
          type: text
          required: false
          default: ""
        - question_name: Scope
          variable: automation_orchestrator_llm_integration_scope
          type: multiplechoice
          choices: [global, project]
          required: true
          default: global
        - question_name: Automation Orchestrator verifies the provider certificate
          question_description: false sets insecure_skip_tls_verify on the integration; prefer the certificate authority bundle below
          variable: automation_orchestrator_llm_integration_provider_validate_certs
          type: multiplechoice
          choices: ["true", "false"]
          required: true
          default: "true"
        - question_name: Provider certificate authority bundle (PEM)
          question_description: Only for internally signed provider certificates; empty = Automation Orchestrator's default trust
          variable: automation_orchestrator_llm_integration_provider_ca_certificate
          type: textarea
          required: false
          default: ""
        - question_name: Allow plain HTTP
          variable: automation_orchestrator_llm_integration_allow_http
          type: multiplechoice
          choices: ["false", "true"]
          required: true
          default: "false"
        - question_name: Verify TLS certificates from this job
          question_description: The job's calls to the cluster API and Automation Orchestrator
          variable: automation_orchestrator_llm_integration_validate_certs
          type: multiplechoice
          choices: ["true", "false"]
          required: true
          default: "true"

  # --- CVE remediation: launched by the Automation Orchestrator workflow (no surveys; it passes limit and variables) ---
  - name: CVE remediation | Assess hosts
    description: >-
      Read-only. Collect installed packages and the fixes available from Satellite for one CVE and report them to
      Automation Orchestrator (playbook cve_remediation_assess.yml)
    organization: "{{ site_organization }}"
    project: Configuration as code - ansible-config-as-code
    playbook: playbooks/cve_remediation_assess.yml
    inventory: CVE remediation - sample hosts
    execution_environment: "{{ site_execution_environment }}"
    credentials:
      - "{{ site_machine_credential }}"
    ask_limit_on_launch: true
    ask_variables_on_launch: true

  - name: CVE remediation | Apply fix
    description: >-
      Changes hosts. Install the minimal fix for one CVE from Satellite, reboot only if needed, and re-check; launched
      only after the workflow's approval step (playbook cve_remediation_apply.yml)
    organization: "{{ site_organization }}"
    project: Configuration as code - ansible-config-as-code
    playbook: playbooks/cve_remediation_apply.yml
    inventory: CVE remediation - sample hosts
    execution_environment: "{{ site_execution_environment }}"
    credentials:
      - "{{ site_machine_credential }}"
    ask_limit_on_launch: true
    ask_variables_on_launch: true

  - name: Automation Orchestrator | Configure CVE remediation workflow
    description: >-
      Add or update the CVE remediation workflow in Automation Orchestrator (role
      automation_orchestrator_cve_remediation)
    organization: "{{ site_organization }}"
    project: Configuration as code - ansible-config-as-code
    playbook: playbooks/automation_orchestrator_cve_remediation.yml
    inventory: Configuration as code - localhost
    execution_environment: "{{ site_execution_environment }}"
    credentials:
      - Configuration as code - OpenShift API
    survey_enabled: true
    survey_spec:
      name: Automation Orchestrator CVE remediation workflow
      description: >-
        Inputs for automation_orchestrator_cve_remediation (the Automation Orchestrator URL, admin password and
        certificate authority are discovered from the cluster)
      spec:
        - question_name: Automation Orchestrator namespace
          variable: automation_orchestrator_cve_remediation_namespace
          type: text
          required: true
          default: automation-orchestrator
        - question_name: Workflow name
          variable: automation_orchestrator_cve_remediation_workflow_name
          type: text
          required: true
          default: CVE remediation
        - question_name: Ansible Automation Platform integration name
          question_description: The Automation Orchestrator integration that launches the job templates
          variable: automation_orchestrator_cve_remediation_platform_integration_name
          type: text
          required: true
          default: "{{ site_automation_orchestrator_platform_integration_name }}"
        - question_name: LLM provider integration name
          variable: automation_orchestrator_cve_remediation_llm_integration_name
          type: text
          required: true
          default: LLM provider
        - question_name: LLM model
          question_description: Provider model ID; empty = the integration's default model, else its first enabled model
          variable: automation_orchestrator_cve_remediation_llm_model
          type: text
          required: false
          default: ""
        - question_name: Approver groups
          question_description: Comma-separated Automation Orchestrator groups whose members can approve the fix
          variable: automation_orchestrator_cve_remediation_approver_groups
          type: text
          required: false
          default: admins
        - question_name: Approver users
          question_description: Comma-separated Automation Orchestrator usernames who can approve the fix
          variable: automation_orchestrator_cve_remediation_approver_users
          type: text
          required: false
          default: ""
        - question_name: Approval window (seconds)
          question_description: After this, the request expires and the workflow stops without changes
          variable: automation_orchestrator_cve_remediation_decision_window
          type: integer
          min: 300
          max: 604800
          required: true
          default: 86400
        - question_name: Reboot hosts when needed after the fix
          variable: automation_orchestrator_cve_remediation_reboot
          type: multiplechoice
          choices: ["true", "false"]
          required: true
          default: "true"
        - question_name: Verify TLS certificates from this job
          question_description: The job's calls to the cluster API and Automation Orchestrator
          variable: automation_orchestrator_cve_remediation_validate_certs
          type: multiplechoice
          choices: ["true", "false"]
          required: true
          default: "true"
...
