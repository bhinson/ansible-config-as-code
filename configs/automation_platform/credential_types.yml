---
# Custom credential types (infra.aap_configuration role controller_credential_types).
# Injector templates are tagged !unsafe so Ansible doesn't render them when this file is loaded;
# Ansible Automation Platform renders them at job launch.
controller_credential_types:
  # The managed "OpenShift or Kubernetes API Bearer Token" type has NO injectors (container groups only),
  # so playbooks need a custom type. This one feeds kubernetes.core /
  # redhat.openshift modules, including the API CA so TLS verification works inside the execution environment.
  - name: OpenShift API (configuration as code)
    description: Injects K8S_AUTH_HOST, K8S_AUTH_API_KEY and K8S_AUTH_SSL_CA_CERT for kubernetes.core / redhat.openshift
    kind: cloud
    inputs:
      fields:
        - id: host
          type: string
          label: API URL
          help_text: e.g. https://api.cluster.example.com:6443
        - id: bearer_token
          type: string
          label: Bearer token
          secret: true
        - id: ssl_ca_cert
          type: string
          label: API CA certificate (PEM)
          multiline: true
      required:
        - host
        - bearer_token
        - ssl_ca_cert
    injectors:
      env:
        K8S_AUTH_HOST: !unsafe "{{ host }}"
        K8S_AUTH_API_KEY: !unsafe "{{ bearer_token }}"
        K8S_AUTH_SSL_CA_CERT: !unsafe "{{ tower.filename.k8s_ca }}"
      file:
        template.k8s_ca: !unsafe "{{ ssl_ca_cert }}"
...
