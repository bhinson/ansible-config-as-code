---
# automation_orchestrator_llm_integration: connect a running Automation Orchestrator (AO) to an OpenAI v1
# API-compatible large language model (LLM) provider so workflow agent nodes can use it.
# AO configure guide: "Configure an LLM provider integration". Request shapes come from the OpenAPI specification
# AO serves at /api_docs/v1/openapi.json (develop guide: "Access and use the OpenAPI specification").
# Inputs normally come from the job template survey; AO URL, admin password and certificate authority are discovered
# from the cluster when left empty.

# --- where AO runs (must match openshift_automation_orchestrator) ---
automation_orchestrator_llm_integration_namespace: automation-orchestrator
# Empty = https://<host of the AO Route in the namespace>
automation_orchestrator_llm_integration_orchestrator_url: ""
automation_orchestrator_llm_integration_admin_username: admin
# Empty = read from the Secret below
automation_orchestrator_llm_integration_admin_password: ""
automation_orchestrator_llm_integration_admin_password_secret: ao-admin-password
# PEM bundle used by this job to verify the AO route; empty = OpenShift ingress certificate authority (CA)
automation_orchestrator_llm_integration_orchestrator_ca_certificate: ""
# Verify TLS certificates on this job's calls to the cluster API and AO
automation_orchestrator_llm_integration_validate_certs: true

# --- LLM provider ---
automation_orchestrator_llm_integration_name: LLM provider
automation_orchestrator_llm_integration_description: ""
# red_hat_ai | openai | anthropic | gemini | custom
automation_orchestrator_llm_integration_provider: custom
# OpenAI v1 API-compatible base URL, e.g. https://llm.example.com/v1 (required for red_hat_ai and custom)
automation_orchestrator_llm_integration_base_url: ""
# API key; stored in AO as an "LLM Provider" credential and used for health checks and model discovery
automation_orchestrator_llm_integration_api_key: ""
automation_orchestrator_llm_integration_credential_name: LLM provider API key
# Re-apply the API key on every run
automation_orchestrator_llm_integration_update_credential: true
# global | project
automation_orchestrator_llm_integration_scope: global

# --- TLS from AO to the provider (the integration's Security settings) ---
# Verify the provider's TLS certificate (false sets insecure_skip_tls_verify on the integration)
automation_orchestrator_llm_integration_provider_validate_certs: true
# Optional PEM CA bundle AO should trust for the provider (for internally signed certificates)
automation_orchestrator_llm_integration_provider_ca_certificate: ""
# Permit plain http:// base URLs
automation_orchestrator_llm_integration_allow_http: false

# --- models ---
# Model IDs to enable (list or comma-separated); empty = every discovered model
automation_orchestrator_llm_integration_enabled_models: []
# Model ID to make the integration default; empty = leave as is
automation_orchestrator_llm_integration_default_model: ""

# --- waits ---
automation_orchestrator_llm_integration_wait_retries: 30
automation_orchestrator_llm_integration_wait_delay: 10
...
