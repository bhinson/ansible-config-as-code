[defaults]
# Intended runtime: an Ansible Automation Platform (AAP) project (job templates run these playbooks in an execution environment).
# Collections are installed by AAP's project sync from collections/requirements.yml using the
# organization's Galaxy credentials (console.redhat.com certified/validated, private hub, Galaxy),
# so no [galaxy] servers or tokens are configured here.
inventory = inventory/hosts.yml
collections_path = ./collections
roles_path = ./roles
stdout_callback = ansible.builtin.default
callback_result_format = yaml
interpreter_python = auto_silent
retry_files_enabled = false
