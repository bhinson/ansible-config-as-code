---
- name: Discover | Read the OpenShift ingress certificate authority
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    namespace: openshift-config-managed
    name: default-ingress-cert
  register: __orchestrator_cve_ingress_ca
  when: automation_orchestrator_cve_remediation_orchestrator_ca_certificate | length == 0

- name: Discover | Create a temporary certificate authority file for API calls
  ansible.builtin.tempfile:
    state: file
    suffix: .pem
  register: __orchestrator_cve_ca_file

- name: Discover | Write the certificate authority file
  ansible.builtin.copy:
    content: >-
      {{ automation_orchestrator_cve_remediation_orchestrator_ca_certificate
         if automation_orchestrator_cve_remediation_orchestrator_ca_certificate | length > 0
         else __orchestrator_cve_ingress_ca.resources[0].data['ca-bundle.crt'] }}
    dest: "{{ __orchestrator_cve_ca_file.path }}"
    mode: "0600"

- name: Discover | Find the Automation Orchestrator route
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    namespace: "{{ automation_orchestrator_cve_remediation_namespace }}"
  register: __orchestrator_cve_routes
  when: automation_orchestrator_cve_remediation_orchestrator_url | length == 0

- name: Discover | Read the Automation Orchestrator admin password secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: "{{ automation_orchestrator_cve_remediation_namespace }}"
    name: "{{ automation_orchestrator_cve_remediation_admin_password_secret }}"
  register: __orchestrator_cve_admin_secret
  when: automation_orchestrator_cve_remediation_admin_password | length == 0
  no_log: true

- name: Discover | Resolve the URL, password and list inputs
  ansible.builtin.set_fact:
    __orchestrator_cve_url: >-
      {{ (automation_orchestrator_cve_remediation_orchestrator_url
          if automation_orchestrator_cve_remediation_orchestrator_url | length > 0
          else 'https://' ~ (__orchestrator_cve_routes.resources | map(attribute='spec.host') | first)) | regex_replace('/+$', '') }}
    __orchestrator_cve_admin_password: >-
      {{ automation_orchestrator_cve_remediation_admin_password
         if automation_orchestrator_cve_remediation_admin_password | length > 0
         else (__orchestrator_cve_admin_secret.resources[0].data.password | b64decode) }}
    __orchestrator_cve_approver_groups: >-
      {{ (automation_orchestrator_cve_remediation_approver_groups.split(',')
          if automation_orchestrator_cve_remediation_approver_groups is string
          else automation_orchestrator_cve_remediation_approver_groups) | map('trim') | select | list }}
    __orchestrator_cve_approver_users: >-
      {{ (automation_orchestrator_cve_remediation_approver_users.split(',')
          if automation_orchestrator_cve_remediation_approver_users is string
          else automation_orchestrator_cve_remediation_approver_users) | map('trim') | select | list }}
  no_log: true

- name: Discover | Check inputs
  ansible.builtin.assert:
    that:
      - __orchestrator_cve_url is match('https://.+')
      - __orchestrator_cve_approver_groups | length > 0 or __orchestrator_cve_approver_users | length > 0
      - automation_orchestrator_cve_remediation_decision_window | int > 0
    fail_msg: >-
      Need the Automation Orchestrator route (or automation_orchestrator_cve_remediation_orchestrator_url), at least one
      approver group or user, and a positive decision window.
    quiet: true
...
