#   Local test: source scripts/env.sh && ansible-playbook playbooks/openshift_automation_developer_hub.yml -e @my-vars.yml
- name: Red Hat Developer Hub with the Ansible plug-ins on OpenShift
  hosts: localhost
  gather_facts: false
  roles:
    - role: openshift_automation_developer_hub
...
