---
# Uses redhat.openshift (applies objects) and kubernetes.core (lookups), both Red Hat certified, for cluster objects, and
# ansible.builtin.uri for the Ansible Automation Platform (AAP) gateway API (the OAuth client secret and new token
# values are only returned by the create calls).
# Cluster authentication: K8S_AUTH_* environment variables (job credential). AAP: aap_hostname / aap_token.
# Docs: AAP 2.7 extend guide "Ansible plug-ins for Red Hat Developer Hub" (OCI delivery); RHDH 1.10 "Installing Red Hat
# Developer Hub on OpenShift Container Platform" (operator, Backstage custom resource).

- name: Main | Install Red Hat Developer Hub with the Ansible plug-ins
  module_defaults:
    group/kubernetes.core.k8s:
      validate_certs: "{{ openshift_automation_developer_hub_validate_certs | bool }}"
    redhat.openshift.k8s:
      validate_certs: "{{ openshift_automation_developer_hub_validate_certs | bool }}"
  block:
    - name: Main | Discover settings from the cluster and job credentials
      ansible.builtin.include_tasks: discover.yml

    - name: Main | Install or adopt the Red Hat Developer Hub operator
      ansible.builtin.include_role:
        name: openshift_automation_developer_hub_operator
      vars:
        openshift_automation_developer_hub_operator_validate_certs: "{{ openshift_automation_developer_hub_validate_certs }}"
      when: openshift_automation_developer_hub_manage_operator | bool

    - name: Main | Create the namespace
      redhat.openshift.k8s:  # noqa: fqcn[canonical]
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ openshift_automation_developer_hub_namespace }}"

    - name: Main | Create the Ansible Automation Platform OAuth application and plug-in token
      ansible.builtin.include_tasks: platform_application.yml

    - name: Main | Create the registry and certificate authority credentials
      ansible.builtin.include_tasks: credentials.yml

    - name: Main | Deploy Developer Hub
      ansible.builtin.include_tasks: developer_hub.yml

    - name: Main | Report
      ansible.builtin.debug:
        msg:
          - "Red Hat Developer Hub with the Ansible plug-ins is ready: {{ __developer_hub_url }}"
          - >-
            Sign in with an Ansible Automation Platform account ({{ __developer_hub_platform_url }}), OAuth application
            '{{ openshift_automation_developer_hub_oauth_app_name }}'.
  always:
    - name: Main | Remove the temporary certificate authority file
      ansible.builtin.file:
        path: "{{ __developer_hub_ca_file.path }}"
        state: absent
      when: __developer_hub_ca_file.path is defined
...
