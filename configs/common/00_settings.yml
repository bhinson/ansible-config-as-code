---
# Global configuration as code behaviour for infra.aap_configuration.dispatch.
platform_state: present
# controller_inventory_source_update would sync every inventory source on each run; the sources here update on launch
aap_configuration_dispatcher_exclude_roles: [controller_inventory_source_update]

# ---------------------------------------------------------------------------------------------------------------
# SITE SETTINGS: example values (the project URL is this repo). Put your real values in a vars file OUTSIDE this repo and pass it when applying:
#   ansible-playbook playbooks/openshift_automation_platform.yml -e @/path/to/site.yml
# Extra vars override these defaults. They feed the Ansible Automation Platform (AAP) objects in this folder
# (project URL, job template survey defaults, inventory hosts). See README.md "Site settings" for each one.
# ---------------------------------------------------------------------------------------------------------------

# Areas to apply (folders under configs/), as a list or comma-separated string. configs/common is always applied.
# Use-case areas: automation_orchestrator_install, automation_orchestrator_integration,
# automation_orchestrator_llm_integration, cve_remediation (needs an AO with an AAP and an LLM integration),
# automation_portal (Ansible automation portal on OpenShift; independent of AO), automation_developer_hub (Red Hat
# Developer Hub with the Ansible plug-ins; shares the Developer Hub operator with automation_portal), automation_mcp
# (MCP server for Ansible Automation Platform on an operator-based install), automation_intelligent_assistant
# (automation intelligent assistant chat in the Ansible Automation Platform UI on an operator-based install).
# platform_management changes AAP itself (organization Galaxy credentials, private automation hub sync schedule) and
# needs an AAP administrator token; it is opt-in and never removed by the cleanup playbook.
site_configuration_areas:
  - automation_orchestrator_install
  - automation_orchestrator_integration
  - automation_orchestrator_llm_integration
  - cve_remediation
  - automation_portal
  - automation_developer_hub
  - automation_mcp
  - automation_intelligent_assistant

# AAP organization that owns every object below (AAP's built-in "Default" works).
site_organization: Default
# Git URL and branch the AAP project syncs from (this repo; point it at your fork if you change the code).
site_project_scm_url: https://github.com/bhinson/ansible-config-as-code.git
site_project_scm_branch: main
# Whether jobs verify the AAP gateway certificate (credential "Configuration as code - Ansible Automation Platform").
site_automation_platform_validate_certs: true
# Execution environment for the job templates; needs kubernetes.core and the python kubernetes library.
site_execution_environment: Default execution environment
# AAP gateway hostname: default for the Automation Orchestrator (AO) workflow HTTP allowlist survey question.
site_automation_platform_gateway_host: aap.example.com
# Name of the AO integration that launches AAP jobs (as created by automation_orchestrator_configuration).
site_automation_orchestrator_platform_integration_name: Ansible Automation Platform
# AO single sign-on survey default (automation_orchestrator_integration): "true" = signing out of AO also ends the
# AAP session (RP-initiated logout). AAP asks "Confirm Logout" whenever its own session already expired (gateway
# SESSION_COOKIE_AGE, 15 min by default) and Cancel shows an error; "false" = AO-only sign-out, no AAP page.
site_automation_orchestrator_rp_initiated_logout: "true"
# Existing AAP machine credential (SSH user with sudo) for the hosts in the CVE remediation inventory.
site_machine_credential: Linux hosts
# Credentials for "Automation Orchestrator | Configure CVE remediation workflow": the OpenShift API credential lets it
# discover AO on the same cluster; use [] when AO runs elsewhere and give its URL, admin password and CA in the survey.
site_cve_remediation_workflow_credentials:
  - Configuration as code - OpenShift API
# Hosts for the "CVE remediation - sample hosts" inventory (RHEL, registered to Satellite, reachable over SSH).
site_cve_remediation_sample_hosts:
  - name: rhel9.example.com
# Storage class for the AO PostgreSQL volume (survey default); empty = cluster default. Can't change after install.
site_automation_orchestrator_storage_class: ""
# Ansible automation portal survey defaults (comma-separated strings; empty = operator default / no filter):
# AAP organizations synchronized into the portal catalog, labels a job template needs to appear there, and portal
# administrators (user:default/<AAP username> or group:default/<AAP team>).
site_automation_portal_catalog_organizations: Default
site_automation_portal_job_template_labels: ""
site_automation_portal_admin_users: ""
# Collection catalog from the private automation hub ("true"/"false") and the hub repositories it reads (comma-separated;
# empty = operator default rh-certified, validated, published).
site_automation_portal_collections_enabled: "false"
site_automation_portal_collection_repositories: ""
# Red Hat Developer Hub (survey defaults): operator channel (fast = every update, fast-<version> = z-stream only; shared
# by automation_portal and automation_developer_hub) and the Developer Hub RBAC administrators / super users
# (comma-separated user:default/<AAP username> or group:default/<AAP team>).
site_developer_hub_operator_channel: fast
site_automation_developer_hub_admin_users: ""
site_automation_developer_hub_super_users: ""
# Resource requests profile (survey default of the install job templates for the portal, Developer Hub, intelligent
# assistant and Automation Orchestrator): "default" = operator requests; "small" = reserve little CPU on small or
# single-node clusters (limits unchanged).
site_resource_profile: default
# MCP server survey default (automation_mcp): "true" lets AI agents launch jobs and change AAP (still limited by each
# user's permissions); "false" = read-only tools.
site_automation_mcp_allow_write_operations: "false"
# Automation intelligent assistant survey defaults (automation_intelligent_assistant): LLM provider type (rhoai_vllm,
# openai or azure_openai), inference API base URL (for example https://llm.example.com/v1) and model name (needs tool
# calling). The API token stays a survey password field (empty on reruns = keep the current one).
site_automation_intelligent_assistant_llm_provider_type: rhoai_vllm
site_automation_intelligent_assistant_llm_url: ""
site_automation_intelligent_assistant_llm_model: ""
# LLM provider survey default (automation_orchestrator_llm_integration): OpenAI v1 API-compatible base URL, for example
# https://llm.example.com/v1 (empty = none; required for the custom and red_hat_ai providers). The API key stays a
# survey password field.
site_automation_orchestrator_llm_base_url: ""
# Survey default of the configure job template: channel of the AAP operator Subscription (role
# openshift_automation_platform_operator installs it if missing; an existing Subscription on another channel makes the run
# fail unless the survey allows the change, which upgrades AAP).
site_automation_platform_operator_channel: stable-2.7
# Survey defaults of the configure job template (role openshift_automation_platform): "true" creates the inventory
# "Configuration as code - OpenShift virtual machines" (OpenShift Virtualization source, update on launch), and the
# namespaces it reads (comma-separated; empty = every namespace).
site_openshift_virtual_machine_inventory: "false"
site_openshift_virtual_machine_inventory_namespaces: ""

# --- platform_management area (only used when that area is selected) ---
# Private automation hub base URL (usually the AAP gateway URL); its repositories are served under /api/galaxy/content/.
site_private_automation_hub_url: https://aap.example.com
# Organizations whose Galaxy credential list is managed (the same list for each).
site_galaxy_credential_organizations:
  - name: Default
# Galaxy credentials for those organizations, in order (names of AAP credentials; "Ansible Galaxy" is AAP's built-in
# one). Project syncs query every listed server, so a shorter list is faster: with complete private hub mirrors, the four
# "Private Automation Hub - ..." entries alone avoid all external lookups (collections must then be mirrored first).
site_galaxy_credentials:
  - Private Automation Hub - certified
  - Private Automation Hub - validated
  - Private Automation Hub - published
  - Private Automation Hub - community
  - Red Hat Cloud Console - certified
  - Red Hat Cloud Console - validated
  - Ansible Galaxy
# Hub repositories the scheduled job syncs, and when (an iCalendar RRULE with DTSTART; the time zone goes in TZID).
site_automation_hub_sync_repositories: [rh-certified, validated, community]
site_automation_hub_sync_rrule: "DTSTART;TZID=UTC:20260101T020000 RRULE:FREQ=DAILY;INTERVAL=1"
...
