---
# Area platform_management: Galaxy credential list (site_galaxy_credentials, in order) for the organizations in
# site_galaxy_credential_organizations. Note: ansible-galaxy queries every listed server for every collection and takes
# the newest version found anywhere, so each extra server slows project syncs.
aap_organizations__platform_management: >-
  {{ site_galaxy_credential_organizations | map('combine', {'galaxy_credentials': site_galaxy_credentials}) | list }}
...
