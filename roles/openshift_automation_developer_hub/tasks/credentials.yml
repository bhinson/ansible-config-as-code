---
# Certificate authority (CA) bundle: the cluster trusted bundle (public CAs plus cluster-wide additions, injected by
# OpenShift into a labelled ConfigMap) plus the CA for AAP. It is mounted into the backend (NODE_EXTRA_CA_CERTS), the
# plug-in installer and the dev tools sidecar (SSL_CERT_FILE / REQUESTS_CA_BUNDLE replace the default trust store,
# hence the public CAs), the way the automation portal operator wires it.
# Build PEM joins in double-quoted YAML: in a folded block (>-) Ansible keeps '\n' as a literal backslash-n.
- name: Credentials | Request the cluster trusted certificate authority bundle
  redhat.openshift.k8s:  # noqa: fqcn[canonical]
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ openshift_automation_developer_hub_name }}-trusted-ca-bundle"
        namespace: "{{ openshift_automation_developer_hub_namespace }}"
        labels:
          config.openshift.io/inject-trusted-cabundle: "true"

- name: Credentials | Wait for OpenShift to inject the trusted bundle
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    name: "{{ openshift_automation_developer_hub_name }}-trusted-ca-bundle"
    namespace: "{{ openshift_automation_developer_hub_namespace }}"
  register: __developer_hub_trusted_bundle
  until: (__developer_hub_trusted_bundle.resources[0].data['ca-bundle.crt'] | default('')) | length > 0
  retries: 30
  delay: 5

- name: Credentials | Build the certificate authority bundle
  ansible.builtin.set_fact:
    __developer_hub_ca_bundle: "{{ __developer_hub_trusted_bundle.resources[0].data['ca-bundle.crt'] | trim ~ '\n' ~ __developer_hub_ca | trim ~ '\n' }}"

- name: Credentials | Apply the certificate authority bundle ConfigMap
  redhat.openshift.k8s:  # noqa: fqcn[canonical]
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ openshift_automation_developer_hub_name }}-ca-bundle"
        namespace: "{{ openshift_automation_developer_hub_namespace }}"
      data:
        ca-bundle.crt: "{{ __developer_hub_ca_bundle }}"

- name: Credentials | Read the cluster global pull secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: openshift-config
    name: pull-secret
  register: __developer_hub_pull_secret
  when: openshift_automation_developer_hub_registry_username | length == 0
  no_log: true

- name: Credentials | Build the registry authentication entry
  ansible.builtin.set_fact:
    __developer_hub_registry_entry: >-
      {{ {'auth': (openshift_automation_developer_hub_registry_username ~ ':' ~ openshift_automation_developer_hub_registry_password) | b64encode}
         if openshift_automation_developer_hub_registry_username | length > 0
         else ((__developer_hub_pull_secret.resources[0].data['.dockerconfigjson'] | b64decode | from_json).auths
               [openshift_automation_developer_hub_registry] | default({})) }}
  no_log: true

- name: Credentials | Check registry credentials were found
  ansible.builtin.assert:
    that: __developer_hub_registry_entry.auth | default('') | length > 0
    fail_msg: >-
      No credentials for {{ openshift_automation_developer_hub_registry }} in the cluster global pull secret; give
      openshift_automation_developer_hub_registry_username and _password.
    quiet: true

# AAP 2.7 docs and RHDH 1.10 docs: for an operator deployment the name is fixed, dynamic-plugins-registry-auth (the
# plug-in installer reads auth.json from it; imagePullSecrets don't apply to OCI plug-ins).
- name: Credentials | Apply the registry authentication Secret for the OCI plug-ins
  redhat.openshift.k8s:  # noqa: fqcn[canonical]
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        name: dynamic-plugins-registry-auth
        namespace: "{{ openshift_automation_developer_hub_namespace }}"
      stringData:
        auth.json: "{{ {'auths': {openshift_automation_developer_hub_registry: {'auth': __developer_hub_registry_entry.auth}}} | to_json }}"
  no_log: true
...
