---
# Secrets are created only if missing so re-runs never rotate live database passwords.
- name: Credentials | Check existing secrets
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: "{{ openshift_automation_orchestrator_namespace }}"
    name: "{{ __orchestrator_install_secret_item.name }}"
  loop:
    - {name: ao-backend-db, database: orchestrator, username: orchestrator}
    - {name: ao-temporal-db, database: temporal, username: temporal}
  loop_control:
    loop_var: __orchestrator_install_secret_item
    label: "{{ __orchestrator_install_secret_item.name }}"
  register: __orchestrator_install_secret_check

- name: Credentials | Create missing database secrets
  redhat.openshift.k8s:  # noqa: fqcn[canonical]
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        name: "{{ __orchestrator_install_secret_result.__orchestrator_install_secret_item.name }}"
        namespace: "{{ openshift_automation_orchestrator_namespace }}"
      stringData:
        database: "{{ __orchestrator_install_secret_result.__orchestrator_install_secret_item.database }}"
        username: "{{ __orchestrator_install_secret_result.__orchestrator_install_secret_item.username }}"
        password: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
  loop: "{{ __orchestrator_install_secret_check.results }}"
  loop_control:
    loop_var: __orchestrator_install_secret_result
    label: "{{ __orchestrator_install_secret_result.__orchestrator_install_secret_item.name }}"
  when: __orchestrator_install_secret_result.resources | length == 0
  no_log: true

- name: Credentials | Check admin password secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: "{{ openshift_automation_orchestrator_namespace }}"
    name: ao-admin-password
  register: __orchestrator_install_admin_check

- name: Credentials | Create admin password secret
  redhat.openshift.k8s:  # noqa: fqcn[canonical]
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        name: ao-admin-password
        namespace: "{{ openshift_automation_orchestrator_namespace }}"
      stringData:
        password: >-
          {{ openshift_automation_orchestrator_admin_password
             | default(lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']), true) }}
  when: __orchestrator_install_admin_check.resources | length == 0
  no_log: true
...
