---
# openshift_automation_x2ansible: x2ansible (https://x2ansible.github.io) on OpenShift. The x2a plug-ins for Red Hat
# Developer Hub (RHDH) are the user interface; each migration phase (init, analyze, migrate, publish) runs the
# x2a-convertor image as a Kubernetes Job in the same namespace. Converts Chef, Puppet and Salt code to Ansible with a
# large language model (LLM) and can publish the result as an Ansible Automation Platform (AAP) project.
#   - RHDH operator through the shared role openshift_automation_developer_hub_operator
#   - ServiceAccount + Role for the Jobs, a dedicated AAP user (project admin in one organization) and its token
#   - Secrets, app-config and dynamic plug-in ConfigMaps, Backstage custom resource (CR)
# Community plug-ins and image (not supported by Red Hat). Upstream manifests: github.com/x2ansible/x2ansible deploy/.

# --- operator (shared role; its openshift_automation_developer_hub_operator_* variables apply) ---
openshift_automation_x2ansible_manage_operator: true

# --- instance ---
openshift_automation_x2ansible_namespace: x2ansible
# Backstage CR name; the operator names the Deployment, Service and Route backstage-<name>
openshift_automation_x2ansible_name: x2ansible
# Route hostname; empty = the default OpenShift generates: backstage-<name>-<namespace>.<apps domain>
openshift_automation_x2ansible_route_host: ""

# --- sign-in (x2a gets each user's Git token from the sign-in) ---
# GitHub OAuth app: Homepage URL = the x2ansible URL, Authorization callback URL = <URL>/api/auth/github/handler/frame
openshift_automation_x2ansible_github_client_id: ""
openshift_automation_x2ansible_github_client_secret: ""
# Guest sign-in when no GitHub OAuth app is set (anyone who reaches the URL; Git steps won't work). For a first look only.
openshift_automation_x2ansible_allow_guest_sign_in: false

# --- LLM (OpenAI-compatible API; LiteLLM model names) ---
# Base URL including /v1, for example https://llm.example.com/v1
openshift_automation_x2ansible_llm_url: ""
openshift_automation_x2ansible_llm_token: ""
# LiteLLM model name, for example openai/<model> for an OpenAI-compatible API (needs tool calling)
openshift_automation_x2ansible_llm_model: ""
openshift_automation_x2ansible_llm_max_tokens: 8192
# compact, medium, large or full (larger = more context per call; frontier models: large)
openshift_automation_x2ansible_llm_summary_context_size: compact

# --- convertor Jobs ---
openshift_automation_x2ansible_convertor_image: quay.io/x2ansible/x2a-convertor
# Upstream publishes commit tags only (sha-<commit>); pin one instead of latest
openshift_automation_x2ansible_convertor_image_tag: sha-7b2cff9
# Finished Jobs are deleted after this many seconds
openshift_automation_x2ansible_job_ttl_seconds: 86400

# --- plug-ins (OCI images built for the Backstage version of RHDH 1.10) ---
openshift_automation_x2ansible_plugins_image: ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin
openshift_automation_x2ansible_plugins_tag: bs_1.49.4__2.0.0

# --- publish to Ansible Automation Platform ---
openshift_automation_x2ansible_publish_to_platform: true
# Organization the published projects go to; the dedicated user gets "Organization Project Admin" there
openshift_automation_x2ansible_platform_organization: Default
openshift_automation_x2ansible_platform_username: x2ansible
# AAP URL; empty = aap_hostname from the job's Red Hat Ansible Automation Platform credential
openshift_automation_x2ansible_platform_url: ""
# Token this job uses to create the user (needs user and role admin rights); empty = aap_token (same credential)
openshift_automation_x2ansible_platform_token: ""
# Certificate authority (PEM) for the AAP URL; empty = the OpenShift ingress certificate authority
openshift_automation_x2ansible_ca_certificate: ""

# --- target virtual machine (OpenShift Virtualization) for running converted roles from AAP ---
openshift_automation_x2ansible_target_vm: false
openshift_automation_x2ansible_target_vm_name: x2ansible-target
# Boot source (DataSource in openshift-virtualization-os-images), cluster instance type and preference
openshift_automation_x2ansible_target_vm_data_source: rhel9
openshift_automation_x2ansible_target_vm_instancetype: u1.small
openshift_automation_x2ansible_target_vm_preference: rhel.9
openshift_automation_x2ansible_target_vm_disk_size: 30Gi
openshift_automation_x2ansible_target_vm_user: cloud-user
# Registration through cloud-init: activation key and organization (label); a Satellite server host name installs its
# katello-ca-consumer package first, empty = register to Red Hat. Empty activation key = no registration.
openshift_automation_x2ansible_target_vm_activation_key: ""
openshift_automation_x2ansible_target_vm_registration_organization: ""
openshift_automation_x2ansible_target_vm_registration_server: ""
# Name of the AAP machine credential and inventory for the target VM
openshift_automation_x2ansible_target_vm_platform_name: x2ansible - target virtual machine

# --- resource requests ---
# default = the operator's requests for x2ansible (250m CPU) and upstream's 500m CPU per convertor Job; small = reserve
# little CPU for small or single-node clusters (limits unchanged). The PostgreSQL pod keeps the operator's requests.
openshift_automation_x2ansible_resource_profile: default
openshift_automation_x2ansible_resources:
  default:
    job:
      requests: {cpu: 500m, memory: 1Gi}
      limits: {cpu: 2000m, memory: 4Gi}
  small:
    backstage:
      requests: {cpu: 50m, memory: 512Mi}
      limits: {cpu: "1", memory: 2560Mi}
    job:
      requests: {cpu: 100m, memory: 1Gi}
      limits: {cpu: 2000m, memory: 4Gi}

# --- TLS --- Verify TLS certificates on this job's calls to the cluster API and AAP
openshift_automation_x2ansible_validate_certs: true

# --- waits ---
openshift_automation_x2ansible_wait_retries: 60
openshift_automation_x2ansible_wait_delay: 20
...
