---
# openshift_automation_portal: install Ansible automation portal on OpenShift with the automation portal operator
# (Technology Preview in Ansible Automation Platform (AAP) 2.7) and connect it to an existing AAP:
#   - AAP OAuth application (portal sign-in) and an AAP API token with write scope (catalog synchronization)
#   - Secrets: AAP credentials, registry credentials for the dynamic plugin images, certificate authority (CA) bundle
#   - operator (Subscription), AutomationPortal custom resource (CR), then the OAuth redirect URI for the real portal URL
# Everything is discovered from the cluster or the job's credentials when left empty. Site values belong in job
# template surveys.

# --- operator ---
# Empty = the portal namespace (OwnNamespace install, as in the install guide)
openshift_automation_portal_operator_namespace: ""
openshift_automation_portal_operator_channel: fast
openshift_automation_portal_operator_approval: Automatic
openshift_automation_portal_operator_source: redhat-operators

# Install or adopt the Red Hat Developer Hub operator with the shared role openshift_automation_developer_hub_operator (its
# openshift_automation_developer_hub_operator_* variables apply); false = leave it to the automation portal operator
openshift_automation_portal_manage_developer_hub_operator: true

# --- instance ---
openshift_automation_portal_namespace: automation-portal
openshift_automation_portal_name: portal
# Route hostname; empty = the default: OpenShift generates <route name>-<namespace>.<apps domain> for the route the
# Red Hat Developer Hub operator creates (backstage-<name>), e.g. backstage-portal-automation-portal.apps.example.com.
openshift_automation_portal_route_host: ""
# Secret with the AAP credentials (keys aap-host-url, oauth-client-id, oauth-client-secret, aap-token)
openshift_automation_portal_credentials_secret: secrets-rhaap-portal

# --- AAP ---
# Empty = aap_hostname (Red Hat Ansible Automation Platform credential)
openshift_automation_portal_platform_url: ""
# Token this job uses for the AAP gateway API (OAuth application, catalog token). Empty = aap_token (same credential).
# Needs rights to create OAuth applications in the organization below.
openshift_automation_portal_platform_token: ""
openshift_automation_portal_oauth_app_name: Ansible automation portal
openshift_automation_portal_oauth_app_organization: Default
# AAP returns the OAuth client secret only when it creates the application. If the application exists but the portal
# Secret doesn't hold its client secret, set this to delete and recreate the application (invalidates the old secret).
openshift_automation_portal_recreate_oauth_app: false
# Catalog synchronization token (AAP API token, write scope). Only job templates this token's user can see are
# synchronized. Empty = keep the token already in the portal Secret if it still works, else create one for the
# user of openshift_automation_portal_platform_token.
openshift_automation_portal_catalog_token: ""
# Create a new catalog token even if the stored one works
openshift_automation_portal_rotate_catalog_token: false

# --- catalog (AutomationPortal spec.plugins.catalog) ---
# AAP organizations to synchronize (list or comma-separated); empty = operator default (Default)
openshift_automation_portal_catalog_organizations: []
openshift_automation_portal_catalog_sync_interval: 60
# Only job templates with all of these labels / without any of these labels (list or comma-separated)
openshift_automation_portal_job_template_labels: []
openshift_automation_portal_job_template_exclude_labels: []
# Collection catalog from the private automation hub served by the AAP gateway (the portal reads it with the catalog token)
openshift_automation_portal_collections_enabled: false
# Hub repositories to synchronize (list or comma-separated); empty = operator default (rh-certified, validated, published)
openshift_automation_portal_collection_repositories: []

# --- permissions (spec.permissions) ---
# Portal administrators, for example user:default/<AAP username> or group:default/<AAP team>; empty = operator default
openshift_automation_portal_admin_users: []

# --- registry credentials for the OCI dynamic plugin images (Secret <name>-registry-auth) ---
openshift_automation_portal_registry: registry.redhat.io
# Empty = copy the registry's entry from the cluster global pull secret (openshift-config/pull-secret)
openshift_automation_portal_registry_username: ""
openshift_automation_portal_registry_password: ""

# --- TLS ---
# Verify TLS certificates on this job's calls to the cluster API and AAP
openshift_automation_portal_validate_certs: true
# The portal verifies the AAP certificate (spec.aap.checkSSL); prefer the CA bundle below over false
openshift_automation_portal_check_ssl: true
# PEM CA the portal trusts in addition to the cluster's trusted bundle; empty = OpenShift ingress CA (default-ingress-cert)
openshift_automation_portal_ca_certificate: ""

# --- anything else in the AutomationPortal spec (recursively merged over the generated spec), for example
#     {database: {enableLocalDb: false, authSecretName: portal-db-credentials}} ---
openshift_automation_portal_spec_overrides: {}

# --- resource requests ---
# default = the operator's requests (portal 250m CPU, Ansible dev tools sidecar 1 CPU); small = reserve little CPU for
# small or single-node clusters (requests only; limits stay as the operator sets them). The PostgreSQL pod keeps the
# operator's requests (the AutomationPortal resource has no setting for it).
openshift_automation_portal_resource_profile: default
openshift_automation_portal_small_resources:
  portal:
    requests: {cpu: 50m, memory: 512Mi}
    limits: {cpu: "1", memory: 2560Mi}
  devtools:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {cpu: 2500m, memory: 2560Mi}

# --- waits ---
openshift_automation_portal_wait_retries: 60
openshift_automation_portal_wait_delay: 20
...
