---
# Area platform_management: Galaxy credentials for the private automation hub mirrors and console.redhat.com.
# Tokens are set once (in the AAP UI, or by supplying the vaulted_* variables from a vault file when applying) and kept:
# update_secrets is false and inputs are only sent when the token variable is supplied.
#   vaulted_private_automation_hub_token: an AAP token that can read the private hub's content
#   vaulted_red_hat_automation_hub_token: console.redhat.com Automation Hub offline token
controller_credentials__platform_management:
  - name: Private Automation Hub - certified
    description: Private automation hub mirror of Red Hat certified collections (hub repository rh-certified)
    organization: "{{ site_organization }}"
    credential_type: Ansible Galaxy/Automation Hub API Token
    update_secrets: false
    inputs: >-
      {{ {'url': site_private_automation_hub_url ~ '/api/galaxy/content/rh-certified/', 'token': vaulted_private_automation_hub_token}
         if vaulted_private_automation_hub_token is defined else omit }}
  - name: Private Automation Hub - validated
    description: Private automation hub mirror of Red Hat validated collections (hub repository validated)
    organization: "{{ site_organization }}"
    credential_type: Ansible Galaxy/Automation Hub API Token
    update_secrets: false
    inputs: >-
      {{ {'url': site_private_automation_hub_url ~ '/api/galaxy/content/validated/', 'token': vaulted_private_automation_hub_token}
         if vaulted_private_automation_hub_token is defined else omit }}
  - name: Private Automation Hub - published
    description: Collections created and uploaded locally to the private automation hub (hub repository published)
    organization: "{{ site_organization }}"
    credential_type: Ansible Galaxy/Automation Hub API Token
    update_secrets: false
    inputs: >-
      {{ {'url': site_private_automation_hub_url ~ '/api/galaxy/content/published/', 'token': vaulted_private_automation_hub_token}
         if vaulted_private_automation_hub_token is defined else omit }}
  - name: Private Automation Hub - community
    description: Private automation hub mirror of the Galaxy collections in use (hub repository community)
    organization: "{{ site_organization }}"
    credential_type: Ansible Galaxy/Automation Hub API Token
    update_secrets: false
    inputs: >-
      {{ {'url': site_private_automation_hub_url ~ '/api/galaxy/content/community/', 'token': vaulted_private_automation_hub_token}
         if vaulted_private_automation_hub_token is defined else omit }}
  - name: Red Hat Cloud Console - certified
    description: Red Hat certified collections on console.redhat.com (Red Hat calls this repository "published")
    organization: "{{ site_organization }}"
    credential_type: Ansible Galaxy/Automation Hub API Token
    update_secrets: false
    inputs: >-
      {{ {'url': 'https://console.redhat.com/api/automation-hub/content/published/',
          'auth_url': 'https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token',
          'token': vaulted_red_hat_automation_hub_token}
         if vaulted_red_hat_automation_hub_token is defined else omit }}
  - name: Red Hat Cloud Console - validated
    description: Red Hat validated collections on console.redhat.com
    organization: "{{ site_organization }}"
    credential_type: Ansible Galaxy/Automation Hub API Token
    update_secrets: false
    inputs: >-
      {{ {'url': 'https://console.redhat.com/api/automation-hub/content/validated/',
          'auth_url': 'https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token',
          'token': vaulted_red_hat_automation_hub_token}
         if vaulted_red_hat_automation_hub_token is defined else omit }}
...
