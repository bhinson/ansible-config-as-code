---
# Secret <name>-secrets: environment variables for the x2ansible pod; app-config reads them as ${VARIABLES} and the x2a
# backend passes the LLM and AAP values on to each convertor Job.
# ConfigMap <name>-ca-bundle: the cluster's root certificate authority (the backend calls the Kubernetes API) plus the
# certificate authority for AAP (the backend and the Jobs call AAP).

- name: Credentials | Apply the x2ansible Secret
  redhat.openshift.k8s:  # noqa: fqcn[canonical]
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ openshift_automation_x2ansible_name }}-secrets"
        namespace: "{{ openshift_automation_x2ansible_namespace }}"
      stringData:
        AUTH_GITHUB_CLIENT_ID: "{{ openshift_automation_x2ansible_github_client_id | default('', true) }}"
        AUTH_GITHUB_CLIENT_SECRET: "{{ __x2ansible_github_client_secret }}"
        LLM_MODEL: "{{ openshift_automation_x2ansible_llm_model }}"
        OPENAI_API_BASE: "{{ openshift_automation_x2ansible_llm_url }}"
        OPENAI_API_KEY: "{{ __x2ansible_llm_token }}"
        AAP_URL: "{{ __x2ansible_platform_url }}"
        AAP_ORG_NAME: "{{ openshift_automation_x2ansible_platform_organization }}"
        AAP_OAUTH_TOKEN: "{{ __x2ansible_user_token | default('') }}"
  no_log: true

- name: Credentials | Read the cluster root certificate authority in the namespace
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    namespace: "{{ openshift_automation_x2ansible_namespace }}"
    name: kube-root-ca.crt
  register: __x2ansible_root_ca
  until: (__x2ansible_root_ca.resources[0].data['ca.crt'] | default('')) | length > 0
  retries: 30
  delay: 2

- name: Credentials | Apply the certificate authority bundle
  redhat.openshift.k8s:  # noqa: fqcn[canonical]
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ openshift_automation_x2ansible_name }}-ca-bundle"
        namespace: "{{ openshift_automation_x2ansible_namespace }}"
      data:
        ca-bundle.crt: "{{ __x2ansible_root_ca.resources[0].data['ca.crt'] | trim ~ '\n' ~ __x2ansible_platform_ca | trim ~ '\n' }}"
...
