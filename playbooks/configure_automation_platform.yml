---
# Apply Ansible Automation Platform (AAP) configuration as code with infra.aap_configuration.dispatch: configs/common
# plus the areas in site_configuration_areas (see configs/README.md). Each area defines objects under
# "<dispatch variable>__<area>"; configs/common/aggregate.yml merges the loaded areas.
#   ansible-playbook playbooks/configure_automation_platform.yml -e @site.yml [--check] [--tags <role tag>]
- name: Configure Ansible Automation Platform from code
  hosts: localhost
  gather_facts: false
  pre_tasks:
    - name: Configure Ansible Automation Platform | Load configs/common and the selected areas
      ansible.builtin.include_tasks: tasks/load_configuration.yml
      tags: [always]
  roles:
    - role: infra.aap_configuration.dispatch
...
