---
# Credentials used by the configuration as code job templates. Secret/site inputs are {{ vaulted_* }} variables supplied from a
# vault-encrypted vars file at apply time (never committed in plain text).
controller_credentials:
  - name: Configuration as code - OpenShift API
    description: Cluster API access for openshift_* roles (custom type injects K8S_AUTH_* including the certificate authority)
    organization: "{{ site_organization }}"
    credential_type: OpenShift API (configuration as code)
    inputs:
      host: "{{ vaulted_openshift_api_url }}"
      bearer_token: "{{ vaulted_openshift_api_token }}"
      ssl_ca_cert: "{{ vaulted_openshift_api_ca_cert }}"

  - name: Configuration as code - Ansible Automation Platform
    description: Ansible Automation Platform gateway access for roles that call its API (injects aap_hostname / aap_token)
    organization: "{{ site_organization }}"
    credential_type: Red Hat Ansible Automation Platform
    inputs:
      host: "{{ vaulted_aap_url }}"
      oauth_token: "{{ vaulted_aap_token }}"
      verify_ssl: "{{ site_automation_platform_validate_certs }}"
...
