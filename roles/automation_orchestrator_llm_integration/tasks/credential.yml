---
# Documented AO credential API (develop guide, "Credential API endpoints"; OpenAPI CredentialCreate):
# POST/PATCH /api/v1/credentials with name, credential_type_id, project_id, inputs.
# The built-in "LLM Provider" credential type has one secret input, api_key.
- name: Credential | Look up credential types and projects
  ansible.builtin.uri:
    url: "{{ __orchestrator_llm_url }}/api/v1/{{ __orchestrator_llm_lookup_item }}"
    headers: "{{ __orchestrator_llm_headers }}"
    ca_path: "{{ __orchestrator_llm_ca_file.path }}"
    validate_certs: "{{ automation_orchestrator_llm_integration_validate_certs | bool }}"
  loop: [credential_types, projects]
  loop_control:
    loop_var: __orchestrator_llm_lookup_item
  register: __orchestrator_llm_lookups

- name: Credential | Pick the LLM Provider credential type and the default project
  ansible.builtin.set_fact:
    __orchestrator_llm_credential_type_id: >-
      {{ (__orchestrator_llm_lookups.results[0].json.resources | selectattr('name', 'equalto', 'LLM Provider') | first).id }}
    __orchestrator_llm_project_id: >-
      {{ (__orchestrator_llm_lookups.results[1].json.resources | selectattr('is_default', 'equalto', true) | first).id }}

- name: Credential | List LLM Provider credentials
  ansible.builtin.uri:
    url: "{{ __orchestrator_llm_url }}/api/v1/credentials?credential_type_id={{ __orchestrator_llm_credential_type_id }}&limit=100"
    headers: "{{ __orchestrator_llm_headers }}"
    ca_path: "{{ __orchestrator_llm_ca_file.path }}"
    validate_certs: "{{ automation_orchestrator_llm_integration_validate_certs | bool }}"
  register: __orchestrator_llm_credentials

- name: Credential | Find an existing credential
  ansible.builtin.set_fact:
    __orchestrator_llm_existing_credential: >-
      {{ __orchestrator_llm_credentials.json.resources
         | selectattr('name', 'equalto', automation_orchestrator_llm_integration_credential_name)
         | first | default({}) }}

- name: Credential | Create the LLM Provider credential
  ansible.builtin.uri:
    url: "{{ __orchestrator_llm_url }}/api/v1/credentials"
    method: POST
    headers: "{{ __orchestrator_llm_headers }}"
    body_format: json
    body:
      name: "{{ automation_orchestrator_llm_integration_credential_name }}"
      description: Health check credential for the {{ automation_orchestrator_llm_integration_name }} integration
      credential_type_id: "{{ __orchestrator_llm_credential_type_id }}"
      project_id: "{{ __orchestrator_llm_project_id }}"
      inputs:
        api_key: "{{ automation_orchestrator_llm_integration_api_key }}"
    ca_path: "{{ __orchestrator_llm_ca_file.path }}"
    validate_certs: "{{ automation_orchestrator_llm_integration_validate_certs | bool }}"
    status_code: 201
  register: __orchestrator_llm_credential_create
  when: __orchestrator_llm_existing_credential | length == 0
  changed_when: true
  no_log: true

- name: Credential | Update the API key
  ansible.builtin.uri:
    url: "{{ __orchestrator_llm_url }}/api/v1/credentials/{{ __orchestrator_llm_existing_credential.id }}"
    method: PATCH
    headers: "{{ __orchestrator_llm_headers }}"
    body_format: json
    body:
      inputs:
        api_key: "{{ automation_orchestrator_llm_integration_api_key }}"
    ca_path: "{{ __orchestrator_llm_ca_file.path }}"
    validate_certs: "{{ automation_orchestrator_llm_integration_validate_certs | bool }}"
  when: __orchestrator_llm_existing_credential | length > 0 and automation_orchestrator_llm_integration_update_credential | bool
  changed_when: false     # the API can't tell us whether a secret actually changed
  no_log: true

- name: Credential | Remember the credential id
  ansible.builtin.set_fact:
    __orchestrator_llm_credential_id: >-
      {{ __orchestrator_llm_existing_credential.id if __orchestrator_llm_existing_credential | length > 0
         else __orchestrator_llm_credential_create.json.id }}
...
