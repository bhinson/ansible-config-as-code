---
# Install guide, "Configure credentials and secrets for the automation portal operator" and "Configure custom TLS
# certificates for the automation portal operator". All Secrets are re-applied from their sources on every run.

# The operator mounts spec.deployment.caCertificates as ca-bundle.crt and points SSL_CERT_FILE / REQUESTS_CA_BUNDLE at it,
# which replace the default trust store for some tools. So the bundle holds the cluster's trusted CA bundle (public
# CAs plus any cluster-wide additions, injected by OpenShift into a labelled ConfigMap) plus the CA for AAP.
- name: Credentials | Request the cluster trusted certificate authority bundle
  redhat.openshift.k8s:  # noqa: fqcn[canonical]
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ ansible_automation_portal_name }}-trusted-ca-bundle"
        namespace: "{{ ansible_automation_portal_namespace }}"
        labels:
          config.openshift.io/inject-trusted-cabundle: "true"

- name: Credentials | Wait for OpenShift to inject the trusted bundle
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    name: "{{ ansible_automation_portal_name }}-trusted-ca-bundle"
    namespace: "{{ ansible_automation_portal_namespace }}"
  register: __portal_trusted_bundle
  until: (__portal_trusted_bundle.resources[0].data['ca-bundle.crt'] | default('')) | length > 0
  retries: 30
  delay: 5

- name: Credentials | Apply the certificate authority bundle Secret
  redhat.openshift.k8s:  # noqa: fqcn[canonical]
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        name: "{{ ansible_automation_portal_name }}-ca-bundle"
        namespace: "{{ ansible_automation_portal_namespace }}"
      stringData:
        ca-bundle.crt: "{{ __portal_trusted_bundle.resources[0].data['ca-bundle.crt'] | trim ~ '\n' ~ __portal_ca | trim ~ '\n' }}"

- name: Credentials | Read the cluster global pull secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: openshift-config
    name: pull-secret
  register: __portal_pull_secret
  when: ansible_automation_portal_registry_username | length == 0
  no_log: true

- name: Credentials | Build the registry authentication entry
  ansible.builtin.set_fact:
    __portal_registry_entry: >-
      {{ {'auth': (ansible_automation_portal_registry_username ~ ':' ~ ansible_automation_portal_registry_password) | b64encode}
         if ansible_automation_portal_registry_username | length > 0
         else ((__portal_pull_secret.resources[0].data['.dockerconfigjson'] | b64decode | from_json).auths
               [ansible_automation_portal_registry] | default({})) }}
  no_log: true

- name: Credentials | Check registry credentials were found
  ansible.builtin.assert:
    that: __portal_registry_entry.auth | default('') | length > 0
    fail_msg: >-
      No credentials for {{ ansible_automation_portal_registry }} in the cluster global pull secret; give
      ansible_automation_portal_registry_username and _password.
    quiet: true

# The init container pulls the dynamic plugins with skopeo, which reads this file and ignores imagePullSecrets.
- name: Credentials | Apply the registry authentication Secret
  redhat.openshift.k8s:  # noqa: fqcn[canonical]
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        name: "{{ ansible_automation_portal_name }}-registry-auth"
        namespace: "{{ ansible_automation_portal_namespace }}"
      stringData:
        auth.json: "{{ {'auths': {ansible_automation_portal_registry: {'auth': __portal_registry_entry.auth}}} | to_json }}"
  no_log: true
...
